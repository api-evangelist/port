                                    type: array
                                    items:
                                      type: string
                                    minItems: 1
                                  fromBlueprint:
                                    type: string
                                required:
                                - path
                                additionalProperties: false
                          additionalProperties: false
                          required:
                          - title
                          - target
                          - calculationSpec
                      relations:
                        type: object
                        description: 'The [relations](https://docs.port.io/build-your-software-catalog/customize-integrations/configure-data-model/relate-blueprints/) of the blueprint. <br/> Each relation identifier can be `<= 100 characters` long, values must match the following pattern: `^[A-Za-z0-9@_=\\-]+$`.'
                        propertyNames:
                          pattern: ^[A-Za-z0-9@_=\\-]+$
