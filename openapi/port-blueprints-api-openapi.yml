                                - type: object
                                  properties:
                                    func:
                                      description: The function to use for the aggregation.
                                      enum:
                                      - average
                                    measureTimeBy:
                                      type: string
                                      description: The time property to use for the aggregation.
                                    averageOf:
                                      type: string
                                      enum:
                                      - hour
                                      - day
                                      - week
                                      - month
                                      - total
                                    calculationBy:
                                      type: string
                                      description: Whether to aggregate by entities or properties.
                                      enum:
                                      - entities
                                  required:
                                  - func
                                  - calculationBy
                                  - averageOf
                                  additionalProperties: false
                              - oneOf:
                                - type: object
                                  properties:
                                    func:
                                      type: string
                                      enum:
                                      - sum
                                      - min
                                      - max
                                      - median
                                      description: The function to use for the aggregation.
                                    property:
                                      type: string
                                      description: The property to aggregate.
                                    calculationBy:
                                      type: string
                                      description: Whether to aggregate by property or entities.
                                      enum:
                                      - property
                                  additionalProperties: false
                                  required:
                                  - func
                                  - property
                                  - calculationBy
                                - type: object
                                  properties:
                                    func:
                                      description: The function to use for the aggregation.
                                      enum:
                                      - average
                                    measureTimeBy:
                                      type: string
                                      description: The time property to use for the aggregation.
                                    averageOf:
                                      type: string
                                      enum:
                                      - hour
