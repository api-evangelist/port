      summary: Change a blueprint
      tags:
      - Blueprints
      description: This route allows you to change a specific blueprint in your Port account.<br/><br/>To learn more about blueprints, check out the [documentation](https://docs.port.io/build-your-software-catalog/customize-integrations/configure-data-model/setup-blueprint/).<br/><br/>**Modifying system blueprints** <br/>System blueprints (such as `_team`, `_user`, etc.) are managed by Port and their schemas may change over time. It is recommended to use the [PATCH route](https://docs.port.io/api-reference/update-a-blueprint) to update specific fields instead of replacing the entire schema.<br/>If you do use `PUT`, always [fetch the latest version](https://docs.port.io/api-reference/get-a-blueprint) first and apply your changes on top of it. Sending a stale or incomplete schema will result in a `422` error.
