components:
  schemas:
    def-1:
      type: object
      properties:
        combinator:
          enum:
          - and
          - or
          description: The combinator to use for the rules.
        rules:
          type: array
          items:
            anyOf:
            - type: object
              title: Date Rule
              properties:
                property:
                  oneOf:
                  - type: string
                  - type: object
                    properties:
                      property:
                        type: string
                      context:
                        type: string
                        enum:
                        - user
                        - userTeams
                    required:
                    - property
                    - context
                operator:
                  enum:
                  - between
                  - notBetween
                  - '='
                value:
                  type: object
                  oneOf:
                  - type: object
                    title: Date Range
                    properties:
                      from:
                        type: string
                        format: date-time
                      to:
                        type: string
                        format: date-time
                    required:
                    - from
                    - to
                  - type: object
                    title: Date Preset
                    properties:
                      preset:
                        type: string
                        enum:
                        - today
                        - tomorrow
                        - yesterday
                        - lastDay
                        - lastWeek
                        - last2Weeks
                        - lastMonth
                        - last3Months
                        - last6Months
                        - last12Months
                        - last2Years
                        - last3Years
                        - nextDay
                        - nextWeek
                        - next2Weeks
                        - nextMonth
                        - next3Months
                        - next6Months
                        - next12Months
                    required:
                    - preset
                  - type: object
                    properties:
                      property:
                        type: string
                      context:
                        type: string
                        enum:
                        - user
                        - userTeams
                    required:
                    - property
                    - context
              required:
              - property
              - operator
              - value
              additionalProperties: false
            - type: object
              title: Empty Rule
              oneOf:
              - type: object
                title: Empty Rule
                properties:
                  operator:
                    enum:
                    - isEmpty
                    - isNotEmpty
                  property:
                    type: string
                required:
                - operator
                - property
                additionalProperties: false
            - type: object
              title: Number Rule
              properties:
                property:
                  oneOf:
                  - type: string
                  - type: object
                    properties:
                      property:
                        type: string
                      context:
                        type: string
                        enum:
                        - user
                        - userTeams
                    required:
                    - property
                    - context
                operator:
                  enum:
                  - '>'
                  - '>='
                  - <
                  - <=
                value:
                  anyOf:
                  - type: number
                    title: number
                  - type: string
                    format: date-time
                    title: date-time
                  - type: object
                    properties:
                      property:
                        type: string
                      context:
                        type: string
                        enum:
                        - user
                        - userTeams
                    required:
                    - property
                    - context
              required:
              - property
              - operator
              - value
              additionalProperties: false
            - type: object
              title: Expired Rule
              oneOf:
              - type: object
                title: Expired Rule
                properties:
                  operator:
                    enum:
                    - isExpired
                    - isNotExpired
                  property:
                    type: string
                required:
                - operator
                - property
                additionalProperties: false
            - type: object
              title: String Rule
              oneOf:
              - type: object
                title: String Rule
                properties:
                  property:
                    oneOf:
                    - type: string
                    - type: object
                      properties:
                        property:
                          type: string
                        context:
                          type: string
                          enum:
                          - user
                          - userTeams
                      required:
                      - property
                      - context
                  operator:
                    enum:
                    - '='
                    - '!='
                    - containsAny
                    - contains
                    - doesNotContains
                    - beginsWith
                    - doesNotBeginsWith
                    - endsWith
                    - doesNotEndsWith
                    - in
                    - notIn
                  value:
                    anyOf:
                    - type: 'null'
                      title: 'null'
                    - type: string
                      title: string
                    - type: number
                      title: number
                    - type: boolean
                      title: boolean
                    - type: string
                      format: date-time
                      title: date-time
                    - type: array
                      items:
                        type: string
                      title: array
                    - type: array
                      items:
                        type: number
                      title: array
                    - type: array
                      items:
                        type: boolean
                      title: array
                    - type: array
                      items:
                        type: string
                        format: date-time
                      title: array
                    - type: object
                      properties:
                        property:
                          type: string
                        context:
                          type: string
                          enum:
                          - user
                          - userTeams
                      required:
                      - property
                      - context
                additionalProperties: false
                required:
                - property
                - operator
                - value
            - type: object
              title: Relation Rule
              properties:
                operator:
                  enum:
                  - relatedTo
                blueprint:
                  type: string
                value:
                  anyOf:
                  - type: string
                    title: string
                  - type: array
                    items:
                      type: string
                    title: array
                direction:
                  enum:
                  - upstream
                  - downstream
                required:
                  type: boolean
              additionalProperties: false
              required:
              - operator
              - value
              - blueprint
            - type: object
              title: Property schema rule
              properties:
                propertySchema:
                  type: object
                  properties:
                    type:
                      type: string
                    format:
                      type: string
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        format:
                          type: string
                      required:
                      - type
                  required:
                  - type
                  additionalProperties: false
                operator:
                  enum:
                  - '='
                  - '!='
                  - contains
                value:
                  anyOf:
                  - type: 'null'
                    title: 'null'
                  - type: string
                    title: string
                  - type: number
                    title: number
                  - type: boolean
                    title: boolean
              required:
              - operator
              - propertySchema
              additionalProperties: false
            - type: object
              title: matchAny Rule
              anyOf:
              - type: object
                properties:
                  property:
                    oneOf:
                    - type: object
                      properties:
                        path:
                          type: array
                          items:
                            anyOf:
                            - type: string
                            - type: object
                              properties:
                                relation:
                                  type: string
                                maxHops:
                                  type: number
                                  minimum: 1
                                  maximum: 15
                        fromBlueprint:
                          type: string
                      required:
                      - path
                      additionalProperties: false
                    - oneOf:
                      - type: string
                      - type: object
                        properties:
                          property:
                            type: string
                          context:
                            type: string
                            enum:
                            - user
                            - userTeams
                        required:
                        - property
                        - context
                  operator:
                    type: string
                    enum:
                    - matchAny
                  value:
                    anyOf:
                    - type: array
                      items:
                        type: string
                    - oneOf:
                      - type: string
                      - type: object
                        properties:
                          property:
                            type: string
                          context:
                            type: string
                            enum:
                            - user
                            - userTeams
                        required:
                        - property
                        - context
                required:
                - property
                - operator
                - value
                additionalProperties: false
            - $ref: '#/components/schemas/def-1'
      required:
      - combinator
      - rules
      additionalProperties: false
      example:
        combinator: and
        rules:
        - property: $blueprint
          operator: '='
          value: service
        - combinator: or
          rules:
          - property: environment
            operator: '='
            value: production
          - property: environment
            operator: '='
            value: staging
      title: /schemas/entitiesQuery
  securitySchemes:
    bearer:
      type: apiKey
      name: Authorization
      in: header
