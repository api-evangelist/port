                              - type: string
                                title: string
                              - type: number
                                title: number
                              - type: boolean
                                title: boolean
                              - type: array
                                items:
                                  type: string
                              description: The value to compare against.
                          required:
                          - relation
                          - operator
                          - value
                        - type: object
                          title: Property empty condition
