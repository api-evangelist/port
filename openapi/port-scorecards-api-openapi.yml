openapi: 3.1.0
info:
  title: Port Action Runs Scorecards API
  version: '1.0'
tags:
- name: Scorecards
paths:
  /v1/blueprints/{blueprint_identifier}/scorecards:
    post:
      summary: Create a scorecard
      tags:
      - Scorecards
      description: This route allows you to create a scorecard for a given blueprint. A scorecard is a set of rules that define the quality of a blueprint.<br/><br/>To learn more about scorecards, check out the [documentation](https://docs.port.io/scorecards/overview).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                identifier:
                  type: string
                  pattern: ^(?!\.{1,2}$)[\p{L}0-9@_.+:\\/='-]+$
                  maxLength: 100
                  description: A unique identifier for the scorecard.
                title:
                  type: string
                  description: The title of the scorecard.
                filter:
                  type: object
                  properties:
                    combinator:
                      type: string
                      enum:
                      - and
                      - or
                      description: The combinator to use when evaluating the conditions.
                    conditions:
                      type: array
                      minItems: 1
                      description: The conditions to evaluate.
                      items:
                        anyOf:
                        - type: object
                          title: Property between condition
                          properties:
                            property:
                              type: string
                            operator:
                              enum:
                              - between
                              - notBetween
                              - '='
                            value:
                              type: object
                              oneOf:
                              - type: object
                                title: Date range
                                properties:
                                  from:
                                    type: string
                                    format: date-time
                                  to:
                                    type: string
                                    format: date-time
                                required:
                                - from
                                - to
                              - type: object
                                title: Preset date range
                                properties:
                                  preset:
                                    type: string
                                    enum:
                                    - today
                                    - tomorrow
                                    - yesterday
                                    - lastWeek
                                    - last2Weeks
                                    - lastMonth
                                    - last3Months
                                    - last6Months
                                    - last12Months
                                required:
                                - preset
                          required:
                          - property
                          - operator
                          - value
                          additionalProperties: false
                        - type: object
                          title: Property containsAny condition
                          properties:
                            property:
                              type: string
                            operator:
                              type: string
                              enum:
                              - containsAny
                              - in
                            value:
                              type: array
                              items:
                                type: string
                          required:
                          - property
                          - operator
                          - value
                        - type: object
                          title: Relation containsAny condition
                          properties:
                            relation:
                              type: string
                            operator:
                              type: string
                              enum:
                              - containsAny
                              - in
                            value:
                              type: array
                              items:
                                type: string
                          required:
                          - relation
                          - operator
                          - value
                        - type: object
                          title: Property comparison
                          properties:
                            property:
                              type: string
                            operator:
                              type: string
                              enum:
                              - '='
                              - '!='
                              - '>'
                              - <
                              - '>='
                              - <=
                              - contains
                              - doesNotContains
                              - beginsWith
                              - doesNotBeginsWith
                              - endsWith
                              - doesNotEndsWith
                            value:
                              oneOf:
                              - type: string
                                title: string
                              - type: number
                                title: number
                              - type: boolean
                                title: boolean
                              - type: array
                                items:
                                  type: string
                              description: The value to compare against.
                          required:
                          - property
                          - operator
                          - value
                        - type: object
                          title: Relation comparison
                          properties:
                            relation:
                              type: string
                            operator:
                              type: string
                              enum:
                              - '='
                              - '!='
                              - '>'
                              - <
                              - '>='
                              - <=
                              - contains
                              - doesNotContains
                              - beginsWith
                              - doesNotBeginsWith
                              - endsWith
                              - doesNotEndsWith
                            value:
