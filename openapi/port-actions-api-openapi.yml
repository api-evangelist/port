                        description: The [user inputs](https://docs.port.io/create-self-service-experiences/setup-ui-for-action/user-inputs/) of the action.
                      actionCardButtonText:
                        type: string
                        maxLength: 15
                        minLength: 1
                        pattern: ^[^\s].*[^\s]$
                      executeActionButtonText:
                        type: string
                        maxLength: 15
                        minLength: 1
                        pattern: ^[^\s].*[^\s]$
                      condition:
                        type: object
                        description: Filters used to include/exclude specific entities from the action.
                        additionalProperties: false
                        properties:
                          type:
                            type: string
                            enum:
                            - SEARCH
                          rules:
                            type: array
                            items:
                              anyOf:
                              - type: object
                                title: Date Rule
                                properties:
                                  property:
                                    oneOf:
                                    - type: string
                                    - type: object
                                      properties:
                                        property:
                                          type: string
                                        context:
                                          type: string
                                          enum:
                                          - user
                                          - userTeams
                                      required:
                                      - property
                                      - context
                                  operator:
                                    enum:
                                    - between
                                    - notBetween
                                    - '='
                                  value:
                                    type: object
                                    oneOf:
                                    - type: object
                                      title: Date Range
                                      properties:
                                        from:
                                          type: string
                                          format: date-time
                                        to:
                                          type: string
                                          format: date-time
                                      required:
                                      - from
                                      - to
                                    - type: object
                                      title: Date Preset
                                      properties:
                                        preset:
                                          type: string
                                          enum:
                                          - today
                                          - tomorrow
                                          - yesterday
                                          - lastDay
                                          - lastWeek
                                          - last2Weeks
                                          - lastMonth
                                          - last3Months
                                          - last6Months
                                          - last12Months
                                          - last2Years
                                          - last3Years
                                          - nextDay
                                          - nextWeek
                                          - next2Weeks
                                          - nextMonth
                                          - next3Months
                                          - next6Months
                                          - next12Months
                                      required:
