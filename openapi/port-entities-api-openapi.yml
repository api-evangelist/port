                          anyOf:
                          - type: number
                            title: number
                          - type: string
                            format: date-time
                            title: date-time
                          - type: object
                            properties:
                              property:
                                type: string
                              context:
                                type: string
                                enum:
                                - user
                                - userTeams
                            required:
                            - property
                            - context
                      required:
                      - property
                      - operator
                      - value
                      additionalProperties: false
                    - type: object
                      title: Expired Rule
