                            - doesNotBeginsWith
                            - endsWith
                            - doesNotEndsWith
                            - in
                            - notIn
                          value:
                            anyOf:
                            - type: 'null'
                              title: 'null'
                            - type: string
                              title: string
                            - type: number
                              title: number
                            - type: boolean
                              title: boolean
                            - type: string
                              format: date-time
                              title: date-time
                            - type: array
                              items:
                                type: string
                              title: array
                            - type: array
                              items:
                                type: number
                              title: array
                            - type: array
                              items:
                                type: boolean
                              title: array
                            - type: array
                              items:
                                type: string
                                format: date-time
                              title: array
                            - type: object
