  /v1/entities/aggregate-over-time:
    post:
      summary: Aggregate entities over time
      tags:
      - Entities
      description: This route allows you to perform an aggregation function on a blueprint's entities over a given time range.<br/><br/>To learn more about entities, check out the [entity documentation](https://docs.port.io/build-your-software-catalog/sync-data-to-catalog/#entities).<br/><br/>For more details about Port's search mechanism, rules, and operators - see the [search & query documentation](https://docs.port.io/search-and-query/overview).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - blueprint
              - timeRange
              - timeInterval
              - query
              - measureTimeBy
              - aggregationType
              oneOf:
              - title: Aggregate property
                properties:
                  blueprint:
                    type: string
                    description: The blueprint whose entities you wish to aggregate.
                  timeRange:
                    type: object
                    properties:
                      preset:
                        type: string
                        enum:
                        - today
                        - yesterday
                        - lastDay
                        - lastWeek
                        - last2Weeks
                        - lastMonth
                        - last3Months
                        - last6Months
                        - last12Months
                        - last2Years
                        - last3Years
                        - specific
                      timeZone:
                        type: string
                    required:
                    - preset
                    additionalProperties: false
                  timeInterval:
                    type: string
                    enum:
                    - hour
                    - day
                    - isoWeek
                    - month
                    - quarter
                  query:
                    $ref: '#/components/schemas/def-1'
                    description: A [search query](https://docs.getport.io/search-and-query/overview) used to filter the entities before the aggregation is calculated.
                  measureTimeBy:
                    type: string
                    description: A property of type `datetime` by which the aggregation will be calculated.
                  specificTimeRange:
                    type: array
                    items:
                      type: number
                    minItems: 2
                    maxItems: 2
                    description: A specific time range [min,max] to aggregate over. If not provided, the time range will be used.
                  aggregationType:
                    enum:
                    - aggregatePropertiesValues
                  func:
                    type: string
                    enum:
                    - average
                    - sum
                    - min
                    - max
                    - median
                    - last
                  properties:
                    type: array
                    items:
                      type: string
                    description: A list of properties of type `number` on which the aggregation will be calculated.
                required:
                - func
                - properties
                additionalProperties: false
                allOf:
                - if:
                    type: object
                    properties:
                      timeRange:
                        type: object
                        properties:
                          preset:
                            enum:
                            - last2Years
                            - last3Years
                  then:
                    type: object
                    properties:
                      timeInterval:
                        enum:
                        - quarter
                - if:
                    type: object
                    properties:
                      timeRange:
                        type: object
                        properties:
                          preset:
                            enum:
                            - specific
                    required:
                    - timeRange
                  then:
                    type: object
                    properties:
                      specificTimeRange:
                        type: array
                        items:
                          type: number
                        minItems: 2
                        maxItems: 2
                        description: A specific time range [min,max] to aggregate over. If not provided, the time range will be used.
                    required:
                    - specificTimeRange
              - title: Count entities
                properties:
                  blueprint:
                    type: string
                    description: The blueprint whose entities you wish to aggregate.
                  timeRange:
                    type: object
                    properties:
                      preset:
                        type: string
                        enum:
                        - today
                        - yesterday
                        - lastDay
                        - lastWeek
                        - last2Weeks
                        - lastMonth
                        - last3Months
                        - last6Months
                        - last12Months
                        - last2Years
                        - last3Years
                        - specific
                      timeZone:
                        type: string
                    required:
                    - preset
                    additionalProperties: false
                  timeInterval:
                    type: string
                    enum:
                    - hour
                    - day
                    - isoWeek
                    - month
                    - quarter
                  query:
                    $ref: '#/components/schemas/def-1'
                    description: A [search query](https://docs.getport.io/search-and-query/overview) used to filter the entities before the aggregation is calculated.
                  measureTimeBy:
                    type: string
                    description: A property of type `datetime` by which the aggregation will be calculated.
                  specificTimeRange:
                    type: array
                    items:
                      type: number
                    minItems: 2
                    maxItems: 2
                    description: A specific time range [min,max] to aggregate over. If not provided, the time range will be used.
                  aggregationType:
                    enum:
                    - countEntities
                  func:
                    type: string
                    enum:
                    - count
                    - average
                  breakdownProperty:
                    type: string
                    description: A blueprint's property by which you want to break down the data.
                required:
                - func
                additionalProperties: false
                allOf:
                - if:
                    type: object
                    properties:
                      timeRange:
                        type: object
                        properties:
                          preset:
                            enum:
                            - last2Years
                            - last3Years
                  then:
                    type: object
                    properties:
                      timeInterval:
                        enum:
                        - quarter
                - if:
                    type: object
                    properties:
                      timeRange:
                        type: object
                        properties:
                          preset:
                            enum:
                            - specific
                    required:
                    - timeRange
                  then:
                    type: object
                    properties:
                      specificTimeRange:
                        type: array
                        items:
                          type: number
                        minItems: 2
                        maxItems: 2
                        description: A specific time range [min,max] to aggregate over. If not provided, the time range will be used.
