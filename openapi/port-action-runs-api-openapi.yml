  /v1/actions/runs:
    get:
      summary: Get all action runs
      tags:
      - Action Runs
      description: 'This route allows you to fetch all action runs in your Port account. The route will perform a logical `AND` between all query parameters below, and return all action runs that match the criteria.<br/><br/>To learn more about action runs, check out the [documentation](https://docs.port.io/create-self-service-experiences/reflect-action-progress/).<br/><br/>:::info Version parameter<br/>Set the `version` parameter to `v2` for the latest version of the API.<br/>:::'
      parameters:
      - schema:
          type: string
        in: query
        name: entity
        required: false
        description: The identifier of the entity associated with the action run.
      - schema:
          type: string
        in: query
        name: blueprint
        required: false
        description: The identifier of the blueprint associated with the action run.
      - schema:
          type: boolean
        in: query
        name: active
        required: false
        description: If `true`, only running action runs will be fetched.
      - schema:
          type: string
        in: query
        name: user_email
        required: false
        description: The email of the user who initiated the action run.
      - schema:
          type: string
        in: query
        name: user_id
        required: false
        description: The id of the user who initiated the action run.
      - schema:
          type: number
          minimum: 1
